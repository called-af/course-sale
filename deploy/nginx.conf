# Nginx site config for course-sale.
# Copy to /etc/nginx/sites-available/course-sale and symlink into sites-enabled.
# Replace CHANGE_ME values before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME.example.com www.CHANGE_ME.example.com;

    # Certbot will replace this block with TLS config when run with --nginx.
    # If you manage TLS manually, keep the redirect above and use the HTTPS
    # server block below as the real application server.
    root /var/www/course-sale/public;

    location /.well-known/acme-challenge/ {
        root /var/www/course-sale/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CHANGE_ME.example.com www.CHANGE_ME.example.com;

    root /var/www/course-sale/public;
    index index.php;
    charset utf-8;

    # Certificate/background uploads can be larger than the Nginx default.
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/CHANGE_ME.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Adjust the socket to your PHP-FPM version, e.g. php8.3-fpm.sock.
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Long-cache immutable build assets; Vite filenames already contain hashes.
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Block dotfiles except ACME challenges.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
