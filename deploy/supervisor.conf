; Queue worker for course-sale.
; Copy to /etc/supervisor/conf.d/course-sale.conf, then:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl status course-sale-queue:*

[program:course-sale-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/course-sale/artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=3600 --stop-on-failure
directory=/var/www/course-sale
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/course-sale/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV=production
