models:

  QuizQuestion:
    material_content_id: id foreign:material_contents
    question: text
    sort_order: integer
    timestamps: true

  QuizOption:
    quiz_question_id: id foreign:quiz_questions
    option_text: string
    is_correct: boolean default:false
    timestamps: true

  QuizAttempt:
    user_id: id foreign:users
    material_content_id: id foreign:material_contents
    started_at: timestamp
    finished_at: timestamp nullable
    time_spent: integer nullable
    score: decimal:5,2 nullable
    status: enum:in_progress,completed,expired
    timestamps: true

    indexes:
      - index: user_id
      - index: material_content_id

  QuizAnswer:
    quiz_attempt_id: id foreign:quiz_attempts
    quiz_question_id: id foreign:quiz_questions
    quiz_option_id: id foreign:quiz_options nullable
    answer_text: text nullable
    is_correct: boolean nullable
    timestamps: true

    indexes:
      - index: quiz_attempt_id
